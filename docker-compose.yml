services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FORCE_RESET: ${ADMIN_FORCE_RESET:-false}
      COOKIE_SECURE: ${COOKIE_SECURE}
      CORS_ORIGINS: ""
      MEDIA_DIR: /data/media
    volumes:
      - media_data:/data/media

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT}:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - frontend
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      default:
        # Must match set_real_ip_from in frontend/nginx.conf
        ipv4_address: 172.30.77.10

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.77.0/24

volumes:
  mongo_data:
  media_data:
