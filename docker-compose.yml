services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    # Starts as root only to fix volume ownership, then runs as an unprivileged user
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      - mongo
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FORCE_RESET: ${ADMIN_FORCE_RESET:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      AI_ACTIONS_PER_HOUR: ${AI_ACTIONS_PER_HOUR:-30}
      CORS_ORIGINS: ""
      MEDIA_DIR: /data/media
      # Large uploads and backups use the media volume, not memory-backed /tmp
      TMPDIR: /data/media/.tmp
      RESTORE_MAX_MB: ${RESTORE_MAX_MB:-2048}
      RESTORE_MAX_UNCOMPRESSED_MB: ${RESTORE_MAX_UNCOMPRESSED_MB:-4096}
    volumes:
      - media_data:/data/media

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    ports:
      - "${APP_PORT}:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      - frontend
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      default:
        # Must match set_real_ip_from in frontend/nginx.conf
        ipv4_address: 172.30.77.10

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.77.0/24

volumes:
  mongo_data:
  media_data:
