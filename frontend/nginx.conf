# Was the visitor's request HTTPS? Only believe the tunnel's say-so (same trusted address as set_real_ip_from);
# anyone else's X-Forwarded-Proto / CF-Visitor headers are ignored and we report the real scheme (http).
map $realip_remote_addr $from_tunnel {
    default      0;
    172.30.77.10 1;
}
map "$from_tunnel:$http_x_forwarded_proto:$http_cf_visitor" $client_proto {
    "~^1:https:"                          https;
    '~^1:[^:]*:.*"scheme":"https"'        https;
    default                               $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 512m;

    # Only the bundled cloudflared container (fixed address in docker-compose.yml) may tell us the visitor's
    # IP. Anyone else's CF-Connecting-IP header is ignored and $remote_addr stays the real network peer.
    set_real_ip_from 172.30.77.10;
    real_ip_header CF-Connecting-IP;

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        # Overwrite (never append to) client-supplied forwarding headers so the backend only sees our value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    location /static/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "same-origin";
    }
}
